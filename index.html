<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MediTrack — Gestão de Saúde</title>
  <link rel="stylesheet" href="style.css" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />
</head>
<body>

  <div class="app-shell">

    <aside class="sidebar">
      <div class="sidebar-brand">
        <span class="brand-icon">⚕</span>
        <span class="brand-name">MediTrack</span>
      </div>

      <nav class="sidebar-nav">
        <button class="nav-item active" data-section="farmacia">
          <span class="nav-icon">💊</span>
          <span class="nav-label">Farmácia</span>
        </button>
        <button class="nav-item" data-section="higiene">
          <span class="nav-icon">🧴</span>
          <span class="nav-label">Higiene</span>
        </button>
      </nav>

      <div class="sidebar-footer">
        <span>v1.0</span>
      </div>
    </aside>

    <main class="main-content">

      <section class="section active" id="section-farmacia">
        <div class="section-header">
          <h1 class="section-title">Farmácia</h1>
          <p class="section-subtitle">Registo de medicamentos e receitas</p>
        </div>

        <form class="form-card" id="form-farmacia">
          <div class="form-grid">

            <div class="form-group full-width">
              <label for="med-nome">Nome do Medicamento</label>
              <input type="text" id="med-nome" placeholder="Ex: Brufen 400mg" />
            </div>

            <div class="form-group">
              <label for="med-comprimidos">Nº de Comprimidos</label>
              <input type="number" id="med-comprimidos" min="0" placeholder="0" />
            </div>

            <div class="form-group">
              <label for="med-ml">Quantidade (mL)</label>
              <input type="number" id="med-ml" min="0" step="0.1" placeholder="0.0" />
            </div>

            <div class="form-group">
              <label for="med-ampolas">Nº de Ampolas</label>
              <input type="number" id="med-ampolas" min="0" placeholder="0" />
            </div>

            <div class="form-group">
              <label for="med-data">Data do Recibo</label>
              <input type="date" id="med-data" />
            </div>

          </div>

          <div class="form-actions">
            <button type="button" id="btn-limpar-farmacia" class="btn-secondary">Limpar</button>
            <button type="submit" class="btn-primary">Adicionar Registo</button>
          </div>
        </form>

        <div class="records-header">
          <h2>Registos</h2>
          <span class="records-count" id="farm-count">0 registos</span>
        </div>
        <div class="records-list" id="farm-list">
          <div class="empty-state">
            <span class="empty-icon">💊</span>
            <p>Nenhum medicamento registado ainda.</p>
          </div>
        </div>
      </section>

      <section class="section" id="section-higiene">
        <div class="section-header">
          <h1 class="section-title">Higiene</h1>
          <p class="section-subtitle">Registo de artigos de higiene</p>
        </div>

        <form class="form-card" id="form-higiene">
          <div class="form-grid">

            <div class="form-group full-width">
              <label for="hig-designacao">Designação das Fraldas</label>
              <input type="text" id="hig-designacao" placeholder="Ex: Fraldas Adulto Tamanho L" />
            </div>

            <div class="form-group">
              <label for="hig-qtd-embalagem">Quantidade por Embalagem</label>
              <input type="number" id="hig-qtd-embalagem" min="0" placeholder="0" />
            </div>

            <div class="form-group">
              <label for="hig-num-embalagens">Nº de Embalagens</label>
              <input type="number" id="hig-num-embalagens" min="0" placeholder="0" />
            </div>

            <div class="form-group">
              <label for="hig-data">Data</label>
              <input type="date" id="hig-data" />
            </div>

          </div>

          <div class="form-actions">
            <button type="button" id="btn-limpar-higiene" class="btn-secondary">Limpar</button>
            <button type="submit" class="btn-primary">Adicionar Registo</button>
          </div>
        </form>

        <div class="records-header">
          <h2>Registos</h2>
          <span class="records-count" id="hig-count">0 registos</span>
        </div>
        <div class="records-list" id="hig-list">
          <div class="empty-state">
            <span class="empty-icon">🧴</span>
            <p>Nenhum artigo de higiene registado ainda.</p>
          </div>
        </div>
      </section>

    </main>
  </div>

  <div class="toast" id="toast"></div>

  <script type="module" src="script.js"></script>
</body>
</html>
